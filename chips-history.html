<style>
:root { --bg:#0a0e1a; --panel:#131b2e; --panel2:#1a2440; --ink:#e6ecf5; --muted:#8aa0c0; --acc:#5fb1ff; --cyan:#39c5cf; --border:#1f2942; --red:#ec7063; --red-soft:#5a2a25; --green:#58d68d; --green-soft:#1f3a2a; --amber:#f5b041; }
* { box-sizing: border-box; }
body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; line-height: 1.5; }

.picker input:focus { outline: 2px solid var(--acc); }
.picker button { background: var(--acc); color: #000; border: none; border-radius: 8px; padding: 7px 16px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }

.nav { max-width: 1200px; margin: 0 auto; padding: 0 24px 12px; display: flex; flex-wrap: wrap; gap: 6px; }

.tbl { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.tbl th { background: var(--panel2); color: var(--muted); text-align: right; padding: 8px 10px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
.tbl th:first-child { text-align: left; }
.tbl td { padding: 7px 10px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.04); font-variant-numeric: tabular-nums; }
.tbl td:first-child { text-align: left; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: rgba(95,177,255,0.05); }
.ticker { color: var(--acc); font-weight: 700; font-family: 'Consolas', monospace; }
.industry { color: var(--muted); font-size: 0.75rem; }
.search { width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 0.92rem; font-family: inherit; margin-bottom: 10px; }
.search:focus { outline: 2px solid var(--acc); }
footer { max-width: 1200px; margin: 0 auto 40px; padding: 0 24px; color: var(--muted); font-size: 0.82rem; text-align: center; }
footer a { color: var(--acc); }
.empty { color: var(--muted); text-align: center; padding: 60px 20px; }
/* D034 Persona 角色選擇 (常駐所有頁面) */
.persona-row { max-width: 1200px; margin: 14px auto 0; padding: 0 20px; }
.persona-row-inner { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.persona-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 6px; cursor: pointer; transition: all 0.15s; text-align: center; font-family: inherit; color: var(--ink); }
.persona-card:hover { border-color: var(--acc); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(95,177,255,0.15); }
.persona-card.active { border-color: var(--acc); background: linear-gradient(135deg, rgba(95,177,255,0.15), rgba(57,197,207,0.08)); }
.persona-card .icon { font-size: 1.5rem; margin-bottom: 2px; }
.persona-card .name { font-size: 0.82rem; font-weight: 600; }
.persona-card .desc { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
@media (max-width: 900px) { .persona-row-inner { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 600px) { .persona-row-inner { grid-template-columns: repeat(2, 1fr); } }
.summary-p { max-width: 1200px; margin: 8px 20px 0; padding: 8px 14px; background: linear-gradient(135deg, rgba(95,177,255,0.1), rgba(57,197,207,0.05)); border: 1px solid var(--acc); border-radius: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.82rem; }
.summary-p[hidden] { display: none; }
.summary-p .label { color: var(--muted); font-size: 0.72rem; font-weight: 600; }
.summary-p .pname { font-weight: 700; color: var(--acc); }
.summary-p .conds { color: var(--ink); }
.summary-p .conds .cc { display: inline-block; background: var(--panel2); color: var(--ink); border: 1px solid var(--border); border-radius: 12px; padding: 2px 8px; font-size: 0.7rem; margin-right: 4px; }
.summary-p .actions { margin-left: auto; display: flex; gap: 6px; }
.summary-p button, .summary-p a { background: var(--panel2); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 0.72rem; cursor: pointer; font-family: inherit; text-decoration: none; }
.summary-p button:hover, .summary-p a:hover { border-color: var(--acc); }
.summary-p .danger { color: var(--muted); }
</style>

<main>
  <input type="text" id="search" class="search" placeholder="🔍 篩選 ticker / 名稱 / 產業...">

<script>
var META = null;     // yfinance cache (sector/industry)
var TICKERS = [];    // [{ticker, name, sector, industry}]
var CURRENT = null;  // current date data
var SORT_KEY = 'three';
var SORT_DIR = -1;   // -1 = desc (買超在前)

// 載入 meta
fetch('data/tickers.json')
  .then(function (r) { return r.ok ? r.json() : []; })
  .then(function (j) { TICKERS = j; })
  .catch(function () { TICKERS = []; });

// 列歷史日期
fetch('data/chips-history-index.json')
  .then(function (r) { return r.ok ? r.json() : null; })
  .then(function (idx) {
    if (!idx) return;
    var c = document.getElementById('dates');
    idx.dates.forEach(function (d) {
      var b = document.createElement('button');
      b.textContent = d.slice(5);
      b.setAttribute('data-date', d);
      b.addEventListener('click', function () { loadDate(d); });
      c.appendChild(b);
    });
    // 預設最新一天
    if (idx.dates.length) loadDate(idx.dates[idx.dates.length - 1]);
  });

document.getElementById('go').addEventListener('click', function () {
  var v = document.getElementById('date-input').value;
  if (v) loadDate(v);
});
document.getElementById('date-input').addEventListener('change', function () {
  var v = this.value;
  if (v) loadDate(v);
});
document.getElementById('search').addEventListener('input', function () { renderRows(); });

// 表頭排序
document.querySelectorAll('.tbl th').forEach(function (th, idx) {
  if (idx < 3) return;  // ticker/name/industry 不排序
  th.style.cursor = 'pointer';
  th.addEventListener('click', function () {
    var keys = ['', '', '', 'f', 't', 'd', 'three'];
    SORT_KEY = keys[idx];
    SORT_DIR = SORT_KEY === SORT_KEY && SORT_DIR === -1 ? 1 : -1;
    renderRows();
  });
});

function loadDate(d) {
  document.getElementById('status').textContent = '載入 ' + d + ' …';
  fetch('data/chips-history/' + d + '.json')
    .then(function (r) {
      if (!r.ok) throw new Error('not found');
      return r.json();
    })
    .then(function (data) {
      CURRENT = data;
      document.getElementById('date-input').value = data.date;
      document.getElementById('status').textContent = '資料日 ' + data.date + ' · ' + Object.keys(data.tickers).length + ' 檔';
      document.querySelectorAll('.dates button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-date') === data.date);
      });
      renderSummary();
      renderRows();
    })
    .catch(function () {
      document.getElementById('status').textContent = '❌ ' + d + ' 無資料（週末/假日）';
      document.getElementById('summary').innerHTML = '';
      document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="empty">這天沒有交易資料</td></tr>';
    });
}

function renderSummary() {
  if (!CURRENT) return;
  var f = 0, t = 0, d = 0, n = 0;
  Object.values(CURRENT.tickers).forEach(function (v) {
    f += v.f; t += v.t; d += v.d; n++;
  });
  document.getElementById('summary').innerHTML =
    '<div class="card"><div class="k">涵蓋檔數</div><div class="v">' + n + '</div></div>' +
    '<div class="card"><div class="k">當日外資</div><div class="v ' + (f >= 0 ? 'v-pos' : 'v-neg') + '">' + fmtLots(f) + ' 張</div></div>' +
    '<div class="card"><div class="k">當日投信</div><div class="v ' + (t >= 0 ? 'v-pos' : 'v-neg') + '">' + fmtLots(t) + ' 張</div></div>' +
    '<div class="card"><div class="k">當日自營</div><div class="v ' + (d >= 0 ? 'v-pos' : 'v-neg') + '">' + fmtLots(d) + ' 張</div></div>' +
    '<div class="card"><div class="k">當日 3 法人</div><div class="v ' + (f + t + d >= 0 ? 'v-pos' : 'v-neg') + '">' + fmtLots(f + t + d) + ' 張</div></div>';
}

function renderRows() {
  if (!CURRENT) return;
  var q = (document.getElementById('search').value || '').toLowerCase();
  var rows = [];
  Object.keys(CURRENT.tickers).forEach(function (t) {
    var v = CURRENT.tickers[t];
    var meta = TICKERS.find(function (x) { return x.ticker === t; }) || {};
    var name = meta.name || t;
    var ind = meta.industry_zh || meta.industry || '';
    if (q && (t.indexOf(q) < 0 && name.toLowerCase().indexOf(q) < 0 && ind.toLowerCase().indexOf(q) < 0)) return;
    var three = (v.f || 0) + (v.t || 0) + (v.d || 0);
    rows.push({ ticker: t, name: name, industry: ind, f: v.f, t: v.t, d: v.d, three: three });
  });
  rows.sort(function (a, b) { return (b[SORT_KEY] - a[SORT_KEY]) * SORT_DIR; });
  var html = rows.slice(0, 200).map(function (r) {
    return '<tr><td><a class="ticker" href="analyze/' + r.ticker + '.html" target="_blank">' + r.ticker + '</a></td>' +
      '<td>' + r.name + '</td><td class="industry">' + r.industry + '</td>' +
      '<td class="' + (r.f >= 0 ? 'v-pos' : 'v-neg') + '">' + fmtLots(r.f) + '</td>' +
      '<td class="' + (r.t >= 0 ? 'v-pos' : 'v-neg') + '">' + fmtLots(r.t) + '</td>' +
      '<td class="' + (r.d >= 0 ? 'v-pos' : 'v-neg') + '">' + fmtLots(r.d) + '</td>' +
      '<td class="' + (r.three >= 0 ? 'v-pos' : 'v-neg') + '"><b>' + fmtLots(r.three) + '</b></td></tr>';
  }).join('');
  if (!html) html = '<tr><td colspan="7" class="empty">無資料</td></tr>';
  document.getElementById('rows').innerHTML = html;
}

function fmtLots(n) {
  if (n == null) return '—';
  var lots = n / 1000;
  var sign = n > 0 ? '+' : (n < 0 ? '−' : '');
  if (Math.abs(lots) >= 10000) return sign + (lots / 10000).toFixed(1) + '萬張';
  if (Math.abs(lots) >= 1000) return sign + (lots / 1000).toFixed(1) + 'k張';
  return sign + Math.round(lots) + '張';
}
</script>

<script>// D034 Persona 全站常駐
var PERSONAS_MAP = {
  streak3: { name: '法人連買', presets: ['streak3'] },
  same_buy: { name: '土洋同買', presets: ['same_buy'] },
  f_5d_1y: { name: '外資大買', presets: ['f_5d_1y'] },
  force_high: { name: '量能爆發', presets: ['force_high'] },
  f_stay_long: { name: '外資停留', presets: ['streak3', 'f_stay_long'] },
  same_sell: { name: '空方避雷', presets: ['same_sell', 'streak3_sell'] },
  value: { name: '金融存股', presets: ['streak3'] },
  weak: { name: '弱勢退場', presets: ['streak3_sell', 'force_low'] },
  newbie: { name: '新手精靈' }
};
var PRESET_LABELS = { streak3: '連買 3 天', streak3_sell: '連賣 3 天', same_buy: '土洋同買', same_sell: '土洋同賣', f_5d_1y: '5 日外資 ≥ 1 億', force_high: '力道 ≥ 1.5×', force_low: '力道 ≤ -1.0×', f_stay_long: '停留 5 天+' };
var PERSONA_KEY = 'tank-akali-active-persona-v1';
function setActivePersona(key) {
  try { localStorage.setItem(PERSONA_KEY, key); } catch(e) {}
  var p = PERSONAS_MAP[key];
  if (!p) { clearActivePersona(); return; }
  document.querySelectorAll('.persona-card').forEach(function(c){
    c.classList.toggle('active', c.getAttribute('data-persona') === key);
  });
  var bar = document.getElementById('summary-p');
  if (bar) {
    document.getElementById('sum-p-name').textContent = p.name;
    var conds = (p.presets || []).map(function(k){ return PRESET_LABELS[k] || k; });
    document.getElementById('sum-p-conds').innerHTML = conds.map(function(c){
      return '<span class="cc">' + c + '</span>';
    }).join('');
    bar.hidden = false;
  }
}
function clearActivePersona() {
  try { localStorage.removeItem(PERSONA_KEY); } catch(e) {}
  document.querySelectorAll('.persona-card').forEach(function(c){ c.classList.remove('active'); });
  var bar = document.getElementById('summary-p');
  if (bar) bar.hidden = true;
}
document.querySelectorAll('.persona-card').forEach(function(card){
  card.addEventListener('click', function(){
    var key = card.getAttribute('data-persona');
    if (key === 'newbie') { window.location.href = 'chips.html#wizard'; return; }
    var current = null;
    try { current = localStorage.getItem(PERSONA_KEY); } catch(e) {}
    if (current === key) { clearActivePersona(); } else { setActivePersona(key); }
  });
});
var clearBtn = document.getElementById('sum-p-clear');
if (clearBtn) clearBtn.addEventListener('click', clearActivePersona);
// 載入時恢復
(function() {
  try {
    var saved = localStorage.getItem(PERSONA_KEY);
    if (saved) setActivePersona(saved);
  } catch(e) {}
})();
</script></body>
