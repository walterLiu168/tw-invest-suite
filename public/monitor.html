<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>籌碼監控 · tw-invest-suite</title>
<meta name="description" content="不限檔數的籌碼異動監控 — 土洋同買/對作即時徽章 + 推播">
<meta name="theme-color" content="#0a0e1a">
<meta property="og:title" content="籌碼監控 · tw-invest-suite">
<meta property="og:image" content="https://walterliu168.github.io/tw-invest-suite/data/og.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/textsize.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>📲</text></svg>">
<style>
:root { --bg:#0a0e1a; --panel:#131b2e; --panel2:#1a2440; --ink:#e6ecf5; --muted:#8aa0c0; --acc:#5fb1ff; --cyan:#39c5cf; --border:#1f2942; --red:#ec7063; --red-soft:#5a2a25; --green:#58d68d; --green-soft:#1f3a2a; --amber:#f5b041; --amber-soft:#3a2c1a; }
* { box-sizing: border-box; }
body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; line-height: 1.5; }
a { color: inherit; text-decoration: none; }
.hdr { max-width: 1200px; margin: 0 auto; padding: 32px 24px 12px; }
.hdr h1 { margin: 0 0 6px; font-size: 1.6rem; }
.hdr .sub { color: var(--muted); font-size: 0.92rem; margin: 0; }
.toolbar { max-width: 1200px; margin: 12px auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar input { background: var(--panel); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; font-family: inherit; width: 140px; }
.toolbar input:focus { outline: 2px solid var(--acc); }
.toolbar button { background: var(--acc); color: #000; border: none; border-radius: 8px; padding: 8px 16px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
.toolbar button:hover { filter: brightness(1.1); }
.toolbar button.secondary { background: var(--panel); color: var(--ink); border: 1px solid var(--border); }
.toolbar .spacer { flex: 1; }
.toolbar .counter { color: var(--muted); font-size: 0.85rem; }
.nav { max-width: 1200px; margin: 0 auto; padding: 0 24px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.nav a { padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 0.85rem; }
.nav a:hover { background: var(--panel); color: var(--ink); text-decoration: none; }
.ticker-input { display: flex; flex-direction: column; gap: 4px; }
.ticker-input .hint { color: var(--muted); font-size: 0.7rem; }
main { max-width: 1200px; margin: 0 auto; padding: 16px 24px 60px; }
.alerts { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.alerts h3 { margin: 0 0 8px; color: var(--amber); font-size: 0.95rem; }
.alerts-empty { color: var(--muted); font-size: 0.9rem; padding: 8px 0; }
.alert { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
.alert:last-child { border-bottom: none; }
.alert .at { color: var(--acc); font-family: 'Consolas', monospace; font-weight: 700; }
.alert .aname { color: var(--ink); }
.alert .abadge { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
.alert .abadge.buy { background: var(--red-soft); color: var(--red); }
.alert .abadge.sell { background: var(--green-soft); color: var(--green); }
.alert .abadge.diverge { background: var(--amber-soft); color: var(--amber); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.card { display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; position: relative; transition: all 0.15s; }
.card:hover { border-color: var(--acc); transform: translateY(-1px); }
.card-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.ticker { font-size: 1.1rem; font-weight: 700; color: var(--acc); font-family: 'Consolas', monospace; }
.name { color: var(--ink); font-weight: 500; font-size: 0.9rem; }
.badge { padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
.badge.buy { background: var(--red-soft); color: var(--red); }
.badge.sell { background: var(--green-soft); color: var(--green); }
.badge.diverge { background: var(--amber-soft); color: var(--amber); }
.badge.streak { background: var(--amber-soft); color: var(--amber); }
.card .ind { color: var(--muted); font-size: 0.75rem; margin-bottom: 6px; }
.card .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 6px; }
.card .chip { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
.card .chip .k { color: var(--muted); font-size: 0.62rem; }
.card .chip .v { font-size: 0.85rem; font-weight: 600; margin-top: 1px; font-variant-numeric: tabular-nums; }
.v-pos { color: var(--red); }
.v-neg { color: var(--green); }
.card-foot { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--muted); }
.card-foot .remove { color: var(--red); cursor: pointer; padding: 2px 6px; border-radius: 4px; }
.card-foot .remove:hover { background: var(--red-soft); }
.empty-state { color: var(--muted); text-align: center; padding: 60px 20px; }
.empty-state .ic { font-size: 3rem; opacity: 0.3; }
.empty-state .h { font-size: 1.1rem; margin: 10px 0; }
footer { max-width: 1200px; margin: 0 auto 40px; padding: 0 24px; color: var(--muted); font-size: 0.82rem; text-align: center; }
footer a { color: var(--acc); }
</style>
</head>
<body>

<div class="hdr">
  <h1>📲 籌碼監控</h1>
  <p class="sub">不限檔數的籌碼異動監控 — 土洋同買/對作即時徽章 + 推播</p>
</div>

<div class="toolbar">
  <div class="ticker-input">
    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" id="ticker-input" placeholder="台股代號 e.g. 2330" maxlength="6" pattern="\d{4,6}[A-Z]?">
      <button id="add-btn">＋ 加入監控</button>
    </div>
    <span class="hint">Enter 或按按鈕加入。例：2330, 2609, 1101, 00878</span>
  </div>
  <div class="spacer"></div>
  <span class="counter" id="counter">0 檔監控中</span>
  <button class="secondary" id="clear-btn">清空</button>
</div>

<div class="nav">
  <a href="readme.html">🏠 首頁</a>
  <a href="watchlist.html">📊 24 檔精選</a>
  <a href="sectors.html">🌊 板塊輪動</a>
  <a href="chips.html">💎 籌碼排行</a>
  <a href="chips-advanced.html">📡 籌碼進階</a>
  <a href="chips-history.html">🕐 歷史回看</a>
</div>

<main>
  <div class="alerts" id="alerts">
    <h3>🚨 今日異動</h3>
    <div class="alerts-empty" id="alerts-empty">載入中…</div>
  </div>
  <div class="grid" id="grid">
    <div class="empty-state">
      <div class="ic">📲</div>
      <div class="h">尚未加入任何監控股</div>
      <div>在上方輸入台股代號開始追蹤</div>
    </div>
  </div>
</main>

<footer>
  本地監控（localStorage）· 籌碼資料每日 22:25 更新 · 對作 = 外資 vs 投信 反向<br>
  <a href="https://github.com/walterLiu168/tw-invest-suite">📦 Source</a>
</footer>

<script>
var STORAGE_KEY = 'monitored_tickers';
var CHIPS = null;     // chips.json data
var META = [];        // tickers.json

// 載入
Promise.all([
  fetch('data/chips.json').then(function (r) { return r.ok ? r.json() : null; }),
  fetch('data/tickers.json').then(function (r) { return r.ok ? r.json() : []; })
]).then(function (results) {
  CHIPS = results[0];
  META = results[1];
  renderAlerts();
  renderGrid();
});

function loadTickers() {
  try {
    var t = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return Array.isArray(t) ? t : [];
  } catch (e) { return []; }
}
function saveTickers(arr) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch (e) {}
}

function addTicker(t) {
  t = (t || '').trim().toUpperCase();
  if (!t) return;
  if (!/^\d{4,6}[A-Z]?$/.test(t)) { alert('格式不對，例：2330, 2609, 00878'); return; }
  var list = loadTickers();
  if (list.indexOf(t) >= 0) { alert(t + ' 已在監控中'); return; }
  list.push(t);
  saveTickers(list);
  renderGrid();
  document.getElementById('ticker-input').value = '';
}
function removeTicker(t) {
  var list = loadTickers().filter(function (x) { return x !== t; });
  saveTickers(list);
  renderGrid();
}
function clearAll() {
  if (!confirm('清空所有監控股？')) return;
  saveTickers([]);
  renderGrid();
}

document.getElementById('add-btn').addEventListener('click', function () {
  addTicker(document.getElementById('ticker-input').value);
});
document.getElementById('ticker-input').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') addTicker(e.target.value);
});
document.getElementById('clear-btn').addEventListener('click', clearAll);

function getMeta(t) {
  return META.find(function (x) { return x.ticker === t; }) || { name: t, industry: '' };
}
function findChip(t) {
  if (!CHIPS) return null;
  var allBuy = (CHIPS.tabs.all_buy || []).concat(CHIPS.tabs.all_sell || []);
  return allBuy.find(function (x) { return x.ticker === t; });
}
// 對作 = 一邊買一邊賣
function getAbnormal(t) {
  if (!CHIPS) return null;
  var f = (CHIPS.tabs.all_buy.concat(CHIPS.tabs.all_sell)).find(function (x) { return x.ticker === t; });
  if (!f) return null;
  if (f.same_side === 'buy') return '土洋同買';
  if (f.same_side === 'sell') return '土洋同賣';
  if (f.f_5d_shares > 0 && f.t_5d_shares < 0 && (f.f_5d_shares > 1e6 && f.t_5d_shares < -1e6)) return '土洋對作';
  if (f.f_5d_shares < 0 && f.t_5d_shares > 0 && (f.t_5d_shares > 1e6 && f.f_5d_shares < -1e6)) return '洋土對作';
  return null;
}

function renderAlerts() {
  if (!CHIPS) return;
  var html = '';
  // 從 chips.json 找 今天 對作 + 同買同賣 (限前 8 個)
  var both = [];
  ['same_buy', 'same_sell'].forEach(function (k) {
    (CHIPS.tabs[k] || []).forEach(function (p) {
      both.push({ t: p.ticker, n: p.name, badge: k === 'same_buy' ? 'buy' : 'sell', text: k === 'same_buy' ? '土洋同買' : '土洋同賣' });
    });
  });
  // 對作
  (CHIPS.tabs.all_buy.concat(CHIPS.tabs.all_sell)).forEach(function (p) {
    if (p.same_side) return;
    if (p.f_5d_shares > 0 && p.t_5d_shares < 0 && Math.abs(p.f_5d_shares) > 1e6 && Math.abs(p.t_5d_shares) > 1e6)
      both.push({ t: p.ticker, n: p.name, badge: 'diverge', text: '土洋對作' });
  });
  if (!both.length) {
    document.getElementById('alerts-empty').textContent = '今日無重大異動';
    return;
  }
  html = both.slice(0, 8).map(function (a) {
    return '<a class="alert" href="analyze/' + a.t + '.html" target="_blank">' +
      '<span class="at">' + a.t + '</span>' +
      '<span class="aname">' + a.n + '</span>' +
      '<span class="abadge ' + a.badge + '">' + a.text + '</span>' +
      '</a>';
  }).join('');
  document.getElementById('alerts-empty').style.display = 'none';
  document.getElementById('alerts').insertAdjacentHTML('beforeend', html);
}

function renderGrid() {
  var list = loadTickers();
  document.getElementById('counter').textContent = list.length + ' 檔監控中';
  if (!list.length) {
    document.getElementById('grid').innerHTML =
      '<div class="empty-state"><div class="ic">📲</div><div class="h">尚未加入任何監控股</div>' +
      '<div>在上方輸入台股代號開始追蹤</div></div>';
    return;
  }
  var html = list.map(function (t) {
    var m = getMeta(t);
    var c = findChip(t);
    var ab = getAbnormal(t);
    var badge = '';
    if (c && c.same_side === 'buy') badge = '<span class="badge buy">土洋同買</span>';
    else if (c && c.same_side === 'sell') badge = '<span class="badge sell">土洋同賣</span>';
    else if (ab) badge = '<span class="badge diverge">' + ab + '</span>';
    if (c && c.f_streak >= 3) badge += '<span class="badge streak">外' + (c.f_streak_dir > 0 ? '連買' : '連賣') + c.f_streak + '天</span>';
    var chipsHtml = '';
    if (c) {
      var f3 = c.f_5d_shares, t3 = c.t_5d_shares, d3 = c.d_5d_shares;
      function fmt(n) {
        if (n == null) return '—';
        var lots = n / 1000;
        var sign = n > 0 ? '+' : (n < 0 ? '−' : '');
        if (Math.abs(lots) >= 1000) return sign + (lots / 1000).toFixed(1) + 'k張';
        return sign + Math.round(lots) + '張';
      }
      function cls(n) { return n >= 0 ? 'v-pos' : 'v-neg'; }
      chipsHtml =
        '<div class="chip"><div class="k">5 日外資</div><div class="v ' + cls(f3) + '">' + fmt(f3) + '</div></div>' +
        '<div class="chip"><div class="k">5 日投信</div><div class="v ' + cls(t3) + '">' + fmt(t3) + '</div></div>' +
        '<div class="chip"><div class="k">5 日自營</div><div class="v ' + cls(d3) + '">' + fmt(d3) + '</div></div>';
    } else {
      chipsHtml = '<div class="chip" style="grid-column: 1 / -1"><div class="v muted">無 5 日籌碼資料</div></div>';
    }
    return '<div class="card">' +
      '<div class="card-head">' +
        '<a class="ticker" href="analyze/' + t + '.html" target="_blank">' + t + '</a>' +
        '<a class="name" href="analyze/' + t + '.html" target="_blank">' + (m.name || '') + '</a>' +
        (badge ? '<span style="margin-left:auto">' + badge + '</span>' : '') +
      '</div>' +
      '<div class="ind">' + (m.industry || '—') + '</div>' +
      '<div class="chips">' + chipsHtml + '</div>' +
      '<div class="card-foot"><span>5 日 TWD ' + (c && c.three_5d_twd != null ? (c.three_5d_twd >= 0 ? '+' : '') + c.three_5d_twd + ' 億' : '—') + '</span>' +
        '<span class="remove" data-t="' + t + '">✕ 移除</span>' +
      '</div>' +
    '</div>';
  }).join('');
  document.getElementById('grid').innerHTML = html;
  // 綁定移除
  document.querySelectorAll('.remove').forEach(function (b) {
    b.addEventListener('click', function () { removeTicker(b.getAttribute('data-t')); });
  });
}
</script>
<script src="assets/textsize.js"></script>

</body>
</html>
