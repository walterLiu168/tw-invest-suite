<style>

<div class="hdr">

<div class="viewtabs">

<div id="view-ticker">

  </div>

<div class="drawer" id="drawer">

      <thead><tr>
        <th>日期</th><th>分級</th><th class="hide-sm">方向</th><th>分數</th>
        <th>收盤</th><th class="hide-sm">當日</th><th class="hide-sm">超額60日</th>
        <th class="hide-sm">超額240日</th><th class="hide-sm">狀態</th>

<script>
(function () {
  "use strict";
  var DATA = null, ORDER = [], SHOW = [];
  var DAYS = {}, DAY_LIST = [], DAY_INDEX = {}, SELECTED_DAY = null, VIEW = "ticker";
  var BUCKET_ORDER = ["<100", "100-300", "300-1000", ">1000"];

  function esc(v) {
    if (v === null || v === undefined) return "";
    return String(v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pct(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    var n = Number(v) * 100;
    return (n > 0 ? "+" : "") + n.toFixed(digits === undefined ? 2 : digits) + "%";
  }
  function cls(v) {
    if (v === null || v === undefined || isNaN(v)) return "flat";
    return Number(v) > 0 ? "up" : Number(v) < 0 ? "down" : "flat";
  }
  function sign(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    var n = Number(v) * 100;
    return (n > 0 ? "+" : "") + n.toFixed(digits === undefined ? 2 : digits) + "%";
  }
  function num(v) {
    if (v === null || v === undefined || v === "" || isNaN(v)) return "—";
    return Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function lastReturn(t) {
    if (!t.path || !t.path.length) return null;
    var last = t.path[t.path.length - 1];
    return last && last.length > 2 ? last[2] : null;
  }
  function firstClose(t) {
    if (!t.path || !t.path.length) return null;
    return t.path[0][1];
  }
  function lastClose(t) {
    if (!t.path || !t.path.length) return null;
    return t.path[t.path.length - 1][1];
  }
  function horizonTag(h) {
    if (!h) return "";
    var label = h === "long" ? "長期" : h === "short" ? "短中期" : h;
    return '<span class="tag ' + esc(h) + '">' + esc(label) + "</span>";
  }
  function fmtScore(v) {
    if (v === null || v === undefined || v === "" || isNaN(v)) return "—";
    var n = Number(v);
    // Long scores run 0-100, short scores only 0-3.5: rounding both to an
    // integer would collapse every short pick into a tie.
    return Math.abs(n) < 10 ? n.toFixed(2) : n.toFixed(1);
  }
  function card(k, v, raw) {
    return '<div class="card"><div class="k">' + esc(k) + '</div><div class="v">' +
      (raw ? v : esc(v)) + "</div></div>";
  }

  /* ---------- per-ticker view ---------- */
  function renderCards() {
    var dates = DATA.dates || [];
    var cur = DATA.current || {};
    var onCount = ORDER.filter(function (t) { return t.in_current; }).length;
    var dups = Object.keys(DATA.duplicate_pick_rows || {});
    var html = "";
    html += card("歷史區間", (dates[0] || "—") + " → " + (dates[dates.length - 1] || "—"));
    html += card("篩選次數", DATA.runs + " 次");
    html += card("曾進榜檔數", ORDER.length + " 檔");
    html += card("目前榜上", onCount + " / " + (cur.picks_count || onCount) + " 檔");
    if (dups.length) {
      html += card("同日重複入選", dups.length + " 天");
    }
    document.getElementById("cards").innerHTML = html;
    var sub = "資料日 " + esc(DATA.date || "") + " · 共 " + (DATA.runs || 0) + " 次每日篩選 · " +
      ORDER.length + " 檔曾進榜 · 點任何一列看該檔完整時間軸";
    if (dups.length) {
      sub += "<br>⚠ " + dups.length + " 天有同一檔重複入選，該日不重複計次";
    }
    document.getElementById("sub").innerHTML = sub;
  }

  function apply() {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var flt = document.getElementById("flt").value;
    var sort = document.getElementById("sort").value;
    SHOW = ORDER.filter(function (t) {
      if (flt === "on" && !t.in_current) return false;
      if (flt === "off" && t.in_current) return false;
      if (!q) return true;
      return (t.ticker + " " + t.name + " " + (t.industry || "")).toLowerCase().indexOf(q) >= 0;
    });
    SHOW.sort(function (a, b) {
      if (sort === "appearances") return b.appearances - a.appearances || a.ticker.localeCompare(b.ticker);
      if (sort === "recent") return a.last_seen < b.last_seen ? 1 : a.last_seen > b.last_seen ? -1 : 0;
      if (sort === "first") return a.first_seen < b.first_seen ? -1 : a.first_seen > b.last_seen ? 1 : 0;
      if (sort === "ticker") return a.ticker.localeCompare(b.ticker);
      var ra = lastReturn(a), rb = lastReturn(b);
      if (ra === null) return 1;
      if (rb === null) return -1;
      return rb - ra;
    });
    draw();
  }

  function draw() {
    var rows = "";
    for (var i = 0; i < SHOW.length; i++) {
      var t = SHOW[i];
      var ret = lastReturn(t);
      rows += "<tr data-t=\"" + esc(t.ticker) + "\">";
      rows += "<td class=\"num\">" + esc(t.ticker) + "</td>";
      rows += "<td class=\"name\">" + esc(t.name) + "</td>";
      rows += "<td class=\"ind hide-sm\">" + esc(t.industry || "—") + "</td>";
      rows += "<td class=\"num\">" + esc(t.first_seen) + "</td>";
      rows += "<td class=\"num hide-sm\">" + esc(t.last_seen) + "</td>";
      rows += "<td class=\"num\">" + t.appearances + "</td>";
      rows += "<td>" + (t.current_bucket ? '<span class="tag">' + esc(t.current_bucket) + "</span>" : "—") + "</td>";
      rows += "<td class=\"num hide-sm\">" + num(firstClose(t)) + "</td>";
      rows += "<td class=\"num hide-sm\">" + num(lastClose(t)) + "</td>";
      rows += "<td class=\"num " + cls(ret) + "\">" + pct(ret) + "</td>";
      rows += "<td>" + (t.in_current ? '<span class="tag on">榜上</span>' : '<span class="tag off">已離榜</span>') + "</td>";
      rows += "</tr>";
    }
    document.getElementById("tb").innerHTML = rows;
    document.getElementById("count").textContent = SHOW.length + " / " + ORDER.length + " 檔";
    document.getElementById("tbl").style.display = SHOW.length ? "" : "none";
    document.getElementById("empty").style.display = SHOW.length ? "none" : "";
    var trs = document.getElementById("tb").querySelectorAll("tr");
    for (var j = 0; j < trs.length; j++) {
      trs[j].addEventListener("click", function () { open(this.getAttribute("data-t")); });
    }
  }

  /* ---------- daily top-24 view ---------- */
  function buildDays() {
    DAYS = {};
    for (var i = 0; i < ORDER.length; i++) {
      var t = ORDER[i];
      for (var j = 0; j < t.entries.length; j++) {
        var e = t.entries[j];
        if (!DAYS[e.d]) DAYS[e.d] = [];
        DAYS[e.d].push({ ticker: t.ticker, name: t.name, industry: t.industry, e: e });
      }
    }
    DAY_LIST = Object.keys(DAYS).sort().reverse();
    DAY_INDEX = {};
    for (var k = 0; k < DAY_LIST.length; k++) {
      DAY_INDEX[DAY_LIST[k]] = k;
      var rows = DAYS[DAY_LIST[k]];
      rows.sort(function (a, b) {
        var ba = BUCKET_ORDER.indexOf(a.e.b), bb = BUCKET_ORDER.indexOf(b.e.b);
        if (ba !== bb) return ba - bb;
        var ha = a.e.h === "long" ? 0 : 1, hb = b.e.h === "long" ? 0 : 1;
        if (ha !== hb) return ha - hb;
        var sa = a.e.sc === null ? 0 : a.e.sc, sb = b.e.sc === null ? 0 : b.e.sc;
        if (sa !== sb) return sb - sa;
        return a.ticker.localeCompare(b.ticker);
      });
      var seen = {};
      for (var m = 0; m < rows.length; m++) {
        rows[m].key = rows[m].ticker + "|" + rows[m].e.b + "|" + rows[m].e.h;
        seen[rows[m].key] = (seen[rows[m].key] || 0) + 1;
      }
      rows.dup = Object.keys(seen).filter(function (kk) { return seen[kk] > 1; });
    }
  }

  function prevDayOf(date) {
    var idx = DAY_INDEX[date];
    if (idx === undefined || idx + 1 >= DAY_LIST.length) return null;
    return DAY_LIST[idx + 1];
  }

  function dayStats(date) {
    var rows = DAYS[date] || [];
    var prev = prevDayOf(date);
    var prevSet = {};
    if (prev) {
      var prows = DAYS[prev] || [];
      for (var i = 0; i < prows.length; i++) prevSet[prows[i].ticker] = true;
    }
    var carried = 0, fresh = 0, longs = 0, shorts = 0, up = 0, down = 0, sum = 0, sumN = 0;
    var freshList = [], leaveList = [];
    var curSet = {};
    for (var j = 0; j < rows.length; j++) {
      var r = rows[j];
      curSet[r.ticker] = true;
      if (r.e.h === "long") longs++; else shorts++;
      if (prevSet[r.ticker]) carried++; else { fresh++; freshList.push(r.ticker); }
      if (r.e.chg !== null && r.e.chg !== undefined && !isNaN(r.e.chg)) {
        sum += Number(r.e.chg); sumN++;
        if (Number(r.e.chg) > 0) up++; else if (Number(r.e.chg) < 0) down++;
      }
    }
    if (prev) {
      for (var k in prevSet) {
        if (Object.prototype.hasOwnProperty.call(prevSet, k) && !curSet[k]) leaveList.push(k);
      }
    }
    leaveList.sort();
    return {
      rows: rows, prev: prev, carried: carried, fresh: fresh,
      freshList: freshList, leaveList: leaveList,
      longs: longs, shorts: shorts, up: up, down: down,
      avg: sumN ? sum / sumN : null, dup: rows.dup || []
    };
  }

  function renderDayOverview() {
    var rows = "";
    for (var i = 0; i < DAY_LIST.length; i++) {
      var date = DAY_LIST[i];
      var s = dayStats(date);
      rows += "<tr data-d=\"" + esc(date) + "\">";
      rows += "<td class=\"num\">" + esc(date) + "</td>";
      rows += "<td class=\"num\">" + s.rows.length + "</td>";
      rows += "<td class=\"num\">" + s.carried + "</td>";
      rows += "<td class=\"num\">" + s.fresh + "</td>";
      rows += "<td class=\"num\">" + (s.prev ? s.leaveList.length : "—") + "</td>";
      rows += "<td class=\"num hide-sm\">" + s.longs + "/" + s.shorts + "</td>";
      rows += "<td class=\"num " + cls(s.avg) + "\">" + (s.avg === null ? "—" : sign(s.avg / 100)) + "</td>";
      rows += "<td class=\"num\">" + s.up + " / " + s.down + "</td>";
      rows += "</tr>";
    }
    document.getElementById("histTb").innerHTML = rows;
    document.getElementById("histTbl").style.display = DAY_LIST.length ? "" : "none";
    var trs = document.getElementById("histTb").querySelectorAll("tr");
    for (var j = 0; j < trs.length; j++) {
      trs[j].addEventListener("click", function () {
        document.getElementById("dayPick").value = this.getAttribute("data-d");
        renderDay();
        document.getElementById("dayTbl").scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
  }

  function renderDay() {
    var date = document.getElementById("dayPick").value;
    if (!date || !DAYS[date]) return;
    SELECTED_DAY = date;
    var s = dayStats(date);

    var html = "";
    html += card("資料日", date);
    html += card("在榜檔數", s.rows.length + " 檔");
    html += card("延續前一日", s.carried + " 檔");
    html += card("新進", s.fresh + " 檔");
    if (s.prev) html += card("離榜", s.leaveList.length + " 檔");
    html += card("長期 / 短中期", s.longs + " / " + s.shorts);
    html += card("當日平均", '<span class="' + cls(s.avg) + '">' +
      (s.avg === null ? "—" : sign(s.avg / 100)) + "</span>", true);
    html += card("上漲 / 下跌", s.up + " / " + s.down);
    document.getElementById("dayCards").innerHTML = html;

    var rows = "";
    var current = null;
    for (var i = 0; i < s.rows.length; i++) {
      var r = s.rows[i];
      if (r.e.b !== current) {
        current = r.e.b;
        rows += "<tr class=\"grp\"><td colspan=\"11\">" + esc(current || "未分級") + " 元</td></tr>";
      }
      rows += "<tr data-t=\"" + esc(r.ticker) + "\">";
      rows += "<td class=\"num\">" + esc(r.ticker) + "</td>";
      rows += "<td class=\"name\">" + esc(r.name) + "</td>";
      rows += "<td class=\"ind hide-sm\">" + esc(r.industry || "—") + "</td>";
      rows += "<td>" + (r.e.b ? '<span class="tag">' + esc(r.e.b) + "</span>" : "—") + "</td>";
      rows += "<td>" + horizonTag(r.e.h) + "</td>";
      rows += "<td class=\"num\">" + fmtScore(r.e.sc) + "</td>";
      rows += "<td class=\"num\">" + num(r.e.c) + "</td>";
      rows += "<td class=\"num hide-sm " + cls(r.e.chg) + "\">" + sign(r.e.chg === null ? null : r.e.chg / 100) + "</td>";
      rows += "<td class=\"num hide-sm " + cls(r.e.e60) + "\">" + sign(r.e.e60) + "</td>";
      rows += "<td class=\"num hide-sm " + cls(r.e.e240) + "\">" + sign(r.e.e240) + "</td>";
      var carried = s.prev && s.rows.length && isCarried(r.ticker, s.prev);
      rows += "<td>" + (s.prev
        ? (carried ? '<span class="tag on">延續</span>' : '<span class="tag new">新進</span>')
        : "—") + "</td>";
      rows += "</tr>";
    }
    document.getElementById("dayTb").innerHTML = rows;
    document.getElementById("daySectTitle").textContent =
      "當日 " + s.rows.length + " 檔名單" + (s.dup.length ? "（含 " + s.dup.length + " 檔重複入選）" : "");
    document.getElementById("dayTbl").style.display = s.rows.length ? "" : "none";
    document.getElementById("dayEmpty").style.display = s.rows.length ? "none" : "";
    document.getElementById("dayCount").textContent = s.rows.length + " 檔 · " +
      (s.prev ? "前一日 " + s.prev : "最早一次篩選");

    var dtrs = document.getElementById("dayTb").querySelectorAll("tr[data-t]");
    for (var j = 0; j < dtrs.length; j++) {
      dtrs[j].addEventListener("click", function () { open(this.getAttribute("data-t")); });
    }
  }

  function isCarried(ticker, prevDate) {
    var prows = DAYS[prevDate] || [];
    for (var i = 0; i < prows.length; i++) {
      if (prows[i].ticker === ticker) return true;
    }
    return false;
  }

  function fillDayPicker() {
    var sel = document.getElementById("dayPick");
    var html = "";
    for (var i = 0; i < DAY_LIST.length; i++) {
      html += "<option value=\"" + esc(DAY_LIST[i]) + "\">" + esc(DAY_LIST[i]) + "</option>";
    }
    sel.innerHTML = html;
    if (DAY_LIST.length) sel.value = DAY_LIST[0];
  }

  /* ---------- drawer ---------- */
  function open(ticker) {
    var t = DATA.tickers[ticker];
    if (!t) return;
    document.getElementById("dTitle").innerHTML =
      '<span class="num">' + esc(t.ticker) + "</span> " + esc(t.name);
    document.getElementById("dMeta").textContent =
      (t.industry || "未分類") + " · 首次進榜 " + t.first_seen + " · 最後在榜 " + t.last_seen +
      " · 上榜 " + t.appearances + " 次";
    var ret = lastReturn(t);
    var stats = "";
    stats += statCard("首次進榜", t.first_seen);
    stats += statCard("最後在榜", t.last_seen);
    stats += statCard("上榜次數", t.appearances + " / " + DATA.runs);
    stats += statCard("自首次報酬", '<span class="' + cls(ret) + '">' + pct(ret) + "</span>", true);
    document.getElementById("dStats").innerHTML = stats;
    document.getElementById("dChart").innerHTML = chart(t);
    var rows = "";
    for (var i = t.entries.length - 1; i >= 0; i--) {
      var e = t.entries[i];
      rows += "<tr>";
      rows += "<td class=\"num\">" + esc(e.d) + "</td>";
      rows += "<td>" + (e.b ? '<span class="tag">' + esc(e.b) + "</span>" : "—") + "</td>";
      rows += "<td class=\"hide-sm\">" + horizonTag(e.h) + "</td>";
      rows += "<td class=\"num\">" + fmtScore(e.sc) + "</td>";
      rows += "<td class=\"num\">" + num(e.c) + "</td>";
      rows += "<td class=\"num hide-sm " + cls(e.chg) + "\">" + sign(e.chg === null ? null : e.chg / 100) + "</td>";
      rows += "<td class=\"num hide-sm " + cls(e.e60) + "\">" + sign(e.e60) + "</td>";
      rows += "<td class=\"num hide-sm " + cls(e.e240) + "\">" + sign(e.e240) + "</td>";
      rows += "<td class=\"hide-sm\">" + (e.s ? '<span class="tag">' + esc(e.s) + "</span>" : "—") + "</td>";
      rows += "</tr>";
      if (e.r) {
        var facts = "";
        for (var fk in e.r) {
          if (Object.prototype.hasOwnProperty.call(e.r, fk)) {
            facts += "<div><span class=\"rk\">" + esc(fk) + "</span>" + esc(e.r[fk]) + "</div>";
          }
        }
        rows += "<tr><td colspan=\"9\" style=\"padding:0 0 10px 0;border-bottom:1px solid rgba(31,41,66,.6)\">";
        rows += '<div class="rationale">' + facts + "</div></td></tr>";
      }
    }
    document.getElementById("dTb").innerHTML = rows;
    document.getElementById("drawer").classList.add("open");
    document.getElementById("drawer").scrollTop = 0;
    document.querySelector(".sheet").scrollTop = 0;
    history.replaceState(null, "", "?ticker=" + encodeURIComponent(ticker));
  }
  function statCard(k, v, raw) {
    return '<div class="card"><div class="k">' + esc(k) + '</div><div class="v">' +
      (raw ? v : esc(v)) + "</div></div>";
  }

  function chart(t) {
    var path = t.path || [];
    if (path.length < 2) return '<div class="cap">報酬路徑不足</div>';
    var W = 820, H = 170, PAD = 8;
    var vals = path.map(function (p) { return p[2] === null ? 0 : p[2]; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (hi === lo) { hi += 0.01; lo -= 0.01; }
    var span = hi - lo;
    var step = path.length > 1 ? (W - PAD * 2) / (path.length - 1) : 0;
    var pts = [];
    for (var i = 0; i < path.length; i++) {
      var x = PAD + i * step;
      var y = PAD + (hi - vals[i]) / span * (H - PAD * 2);
      pts.push(x.toFixed(1) + "," + y.toFixed(1));
    }
    var zeroY = PAD + (hi - 0) / span * (H - PAD * 2);
    var lastVal = vals[vals.length - 1];
    var stroke = lastVal >= 0 ? "#ec7063" : "#58d68d";
    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">';
    svg += '<line x1="' + PAD + '" y1="' + zeroY.toFixed(1) + '" x2="' + (W - PAD) + '" y2="' + zeroY.toFixed(1) +
      '" stroke="#1f2942" stroke-width="1" stroke-dasharray="4 4"/>';
    svg += '<polyline fill="none" stroke="' + stroke + '" stroke-width="2" points="' + pts.join(" ") + '"/>';
    svg += "</svg>";
    svg += '<div class="cap">自首次進榜日起的每日報酬（' + esc(path[0][0]) + " 起 · " +
      (lastVal >= 0 ? "紅＝上漲" : "綠＝下跌") + " · 目前 " + pct(lastVal) + "）</div>";
    return svg;
  }

  function closeDrawer() {
    document.getElementById("drawer").classList.remove("open");
    history.replaceState(null, "", location.pathname);
  }

  /* ---------- view switching ---------- */
  function setView(view) {
    VIEW = view;
    document.getElementById("view-ticker").style.display = view === "ticker" ? "" : "none";
    document.getElementById("view-day").style.display = view === "day" ? "" : "none";
    document.getElementById("vt-ticker").classList.toggle("active", view === "ticker");
    document.getElementById("vt-day").classList.toggle("active", view === "day");
    if (view === "day") {
      if (!DAY_LIST.length) buildDays();
      if (!DAY_LIST.length) return;
      renderDayOverview();
      renderDay();
    }
  }

  document.getElementById("close").addEventListener("click", closeDrawer);
  document.getElementById("drawer").addEventListener("click", function (e) {
    if (e.target === this) closeDrawer();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDrawer();
  });
  document.getElementById("q").addEventListener("input", apply);
  document.getElementById("flt").addEventListener("change", apply);
  document.getElementById("sort").addEventListener("change", apply);
  document.getElementById("dayPick").addEventListener("change", renderDay);
  document.getElementById("vt-ticker").addEventListener("click", function () { setView("ticker"); });
  document.getElementById("vt-day").addEventListener("click", function () { setView("day"); });

  fetch("data/watchlist-history.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      DATA = data;
      var raw = data.tickers || {};
      ORDER = Object.keys(raw).map(function (k) {
        var t = raw[k];
        t.ticker = k;
        t.current_bucket = null;
        for (var i = 0; i < t.entries.length; i++) {
          if (t.entries[i].d === (data.current || {}).date) {
            t.current_bucket = t.entries[i].b;
            t.current_horizon = t.entries[i].h;
          }
        }
        return t;
      });
      renderCards();
      document.getElementById("load").style.display = "none";
      apply();
      buildDays();
      fillDayPicker();
      var params = new URLSearchParams(location.search);
      if (params.get("view") === "day") setView("day");
      var want = params.get("ticker");
      if (want && DATA.tickers[want]) open(want);
    })
    .catch(function (err) {
      document.getElementById("load").innerHTML =
        "歷史資料載入失敗：" + esc(err.message) + "<br><span style='font-size:.8rem'>請確認 data/watchlist-history.json 已產生</span>";
    });
})();
</script>
</body>
</html>
